<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infórmate</title>
  <meta name="description" content="México por niveles: el país y su Presidencia, cada estado con su gobierno, sus senadurías y su economía, cada distrito con su diputación y cada municipio con su ayuntamiento. Cada dato lleva su fuente y su fecha.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked">
  <header class="masthead">
    <h1><a href="index.html">Infórmate</a></h1>
    <nav class="tabs" aria-label="Secciones">
        <a href="index.html" aria-current="page">Explorar México</a>
        <a href="mapas-politicos.html">Mapas políticos</a>
        <a href="mapas-economicos.html">Mapas económicos</a>
        <a href="mapas-seguridad.html">Mapas de seguridad</a>
        <a href="poderes.html">Poderes de la Nación</a>
        <a href="fuentes.html">Fuentes</a>
    </nav>
    <div class="masthead__status">
      <p id="data-date"></p>
    </div>
  </header>

  <main>
    <p id="load-error" class="notice" hidden></p>

    <section class="atlas" aria-label="Mapa por niveles y datos de lo elegido">
      <div class="sheet">
        <div class="sheet__bar">
          <nav class="crumbs" id="crumbs" aria-label="Nivel actual"></nav>
          <div class="search" id="search">
            <input type="search" id="search-box" placeholder="Buscar entidad, municipio o ciudad" autocomplete="off" aria-label="Buscar un lugar" aria-controls="search-results" aria-expanded="false">
            <ul class="search__results" id="search-results" role="listbox" hidden></ul>
          </div>
          <div class="zoom" role="group" aria-label="Acercamiento del mapa">
            <button type="button" id="zoom-out" aria-label="Alejar">−</button>
            <button type="button" id="zoom-in" aria-label="Acercar">+</button>
            <button type="button" id="zoom-reset">Volver al país</button>
          </div>
        </div>
        <div class="map-area">
          <div class="map level-country" id="map">
            <canvas aria-hidden="true"></canvas>
            <svg role="img" aria-label="Mapa de México. Los datos de lo que se elige aparecen junto al mapa."></svg>
          </div>
          <div class="tooltip" id="tooltip" hidden></div>
          <div class="map-legend" id="legend" aria-label="Símbolos del mapa"></div>
        </div>
        <div class="sheet__foot">
          <p class="map__hint" id="hint"></p>
          <p class="map__credit" id="map-credit"></p>
        </div>
      </div>

      <aside class="ficha" aria-label="Datos del nivel elegido">
        <div id="ficha" aria-live="polite"></div>
      </aside>
    </section>

  </main>


  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="common.js"></script>
  <script src="explorar.js"></script>
</body>
</html>
